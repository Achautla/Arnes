<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d2023">
<title>Arnés</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1 class="wordmark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="4.5" r="2.5"/><path d="M12 7v7M12 14l-4 7M12 14l4 7M5 10l7-1 7 1"/>
    </svg><span>ARNÉS</span>
  </h1>
  <button class="chip" id="vchip" title="Viñetas">Viñeta</button>
  <div class="hbtns">
    <button class="ibtn" id="undo" aria-label="Deshacer" title="Deshacer (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="ibtn" id="redo" aria-label="Rehacer" title="Rehacer (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
    <button class="xbtn" id="open-export">Exportar</button>
  </div>
</header>

<main id="viewport" aria-label="Visor 3D">
  <div id="frame" aria-hidden="true"></div>
  <svg id="guides" aria-hidden="true"></svg>
  <div id="tbar" class="tbar" hidden></div>
  <div class="hud">
    <span class="tag" id="hud-eye">Ojo — cm</span>
    <span class="tag" id="hud-lens">— mm</span>
    <span class="tag warn" id="hud-balance" hidden>Fuera de equilibrio</span>
    <span class="hint" id="hint"></span>
  </div>
  <button id="exit-through" class="exit">Salir de la vista de cámara</button>
  <div id="toast" role="status" hidden></div>
  <div id="loading">Cargando el motor 3D…</div>
</main>

<nav id="tabs" role="tablist" aria-label="Herramientas">
  <button role="tab" data-tab="escena" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l9 4 9-4M3 12l9 4 9-4M12 3l9 4-9 4-9-4 9-4z"/></svg>Escena
  </button>
  <button role="tab" data-tab="pose" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v6l-3 8M12 13l4 8M6 9.5l6-1 5-3"/></svg>Pose
  </button>
  <button role="tab" data-tab="camara" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="11" rx="2"/><path d="M17 11l4-2.5v8L17 14"/></svg>Cámara
  </button>
  <button role="tab" data-tab="luz" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg>Luz
  </button>
</nav>

<aside id="panel">
  <div class="grabber" aria-hidden="true"></div>
  <div id="panel-body"></div>
</aside>

<dialog id="export" aria-labelledby="xt">
  <div class="dlg">
    <div class="dlg-h"><h2 id="xt">Exportar</h2><button class="ibtn" data-x="close" aria-label="Cerrar">✕</button></div>
    <section>
      <h3>Hoja para imprimir</h3>
      <p class="sub">Hoja carta con la viñeta a escala en líneas claras, lista para dibujar encima a lápiz.</p>
      <div class="frow">
        <label class="num"><span>Ancho de la viñeta</span><input type="number" id="xwidth" value="16" min="5" max="19" step="0.5"><em>cm</em></label>
        <label class="sel"><span>Líneas</span><select id="xink"><option value="azul">Azul claro</option><option value="gris">Gris tenue</option></select></label>
      </div>
      <div class="row"><button class="btn accent" data-x="sheet">Descargar PDF</button><button class="btn" data-x="sheet-png">Descargar PNG</button></div>
    </section>
    <section>
      <h3>Imagen de la viñeta</h3>
      <div class="frow">
        <label class="sel"><span>Capa</span><select id="xlayer"><option value="actual">Como se ve ahora</option><option value="arcilla">Arcilla</option><option value="valores">Valores</option><option value="contorno">Solo contorno</option></select></label>
        <label class="sel"><span>Tamaño</span><select id="xres"><option value="1000">1000 px</option><option value="2000" selected>2000 px</option><option value="4000">4000 px</option></select></label>
      </div>
      <label class="toggle"><span>Fondo transparente</span><input type="checkbox" id="xclear"></label>
      <div class="row"><button class="btn" data-x="png">Descargar PNG</button></div>
    </section>
    <section>
      <h3>Proyecto</h3>
      <p class="sub" id="savestate">Se guarda solo en este dispositivo mientras trabajas.</p>
      <div class="row"><button class="btn" data-x="save-proj">Guardar archivo del proyecto</button><button class="btn" data-x="open-proj">Abrir archivo</button></div>
      <input type="file" id="xfile" accept=".json,.arnes,application/json" hidden>
    </section>
    <p id="xstatus" role="status"></p>
  </div>
</dialog>

<script type="module" src="src/main.js"></script>
<script>
  setTimeout(() => { if (!document.body.classList.contains("ready")) document.getElementById("loading").textContent = "No se pudo cargar el motor 3D. Revisa tu conexión y vuelve a abrir la página."; }, 12000);
</script>
</body>
</html>
